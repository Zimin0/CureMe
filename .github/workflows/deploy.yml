# Автодеплой: при каждом push в main собираем образы здесь, в GitHub,
# и по SSH привозим их на сервер. Сервер ничего не скачивает с Docker Hub
# (из России он бывает недоступен) и не тратит свои 2 ГБ памяти на сборку.
#
# Нужны два секрета репозитория (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  — приватный ключ, публичная часть которого лежит на сервере
#   SSH_KNOWN_HOSTS  — вывод `ssh-keyscan -t ed25519 <IP сервера>`
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 158.255.7.113
  DEPLOY_USER: root
  DEPLOY_DIR: /opt/cureme
  # Домен нужен для HTTPS (без него не работает камера). Его A-записи (@ и www) должны указывать на DEPLOY_HOST.
  CUREME_DOMAIN: kapsulka.ru
  # Дополнительные адреса через пробел: с них и с www.CUREME_DOMAIN Caddy делает редирект на CUREME_DOMAIN.
  # Каждый должен указывать на DEPLOY_HOST, иначе Caddy не получит для него сертификат. Можно оставить пустым.
  CUREME_OLD_DOMAIN: 158-255-7-113.sslip.io kapsulka.online www.kapsulka.online
  CADDY_IMAGE: caddy:2-alpine

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t cureme-app:latest .
          docker pull "$CADDY_IMAGE"
          docker save cureme-app:latest "$CADDY_IMAGE" | gzip > images.tar.gz
          ls -lh images.tar.gz

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # tr убирает \r, если ключ вставили из Windows
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a private key. Paste the whole output of 'cat ~/.ssh/cureme_deploy' (the file without .pub), BEGIN and END lines included."
            exit 1
          fi
          cat > ~/.ssh/config <<CFG
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          CFG

      - name: Upload
        run: |
          ssh server "mkdir -p $DEPLOY_DIR/deploy"
          scp images.tar.gz docker-compose.yml docker-compose.prod.yml server:$DEPLOY_DIR/
          scp deploy/Caddyfile server:$DEPLOY_DIR/deploy/

      - name: Restart on server
        run: |
          ssh server DEPLOY_DIR="$DEPLOY_DIR" CUREME_DOMAIN="$CUREME_DOMAIN" "CUREME_OLD_DOMAIN='$CUREME_OLD_DOMAIN'" bash -s <<'SH'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          gunzip -c images.tar.gz | docker load
          rm images.tar.gz
          # секретный ключ создаётся один раз на сервере и больше не меняется (иначе всех разлогинит)
          touch .env && chmod 600 .env
          grep -q '^CUREME_SECRET_KEY=' .env || echo "CUREME_SECRET_KEY=$(openssl rand -hex 32)" >> .env
          sed -i '/^CUREME_DOMAIN=/d; /^CUREME_OLD_DOMAIN=/d' .env
          echo "CUREME_DOMAIN=$CUREME_DOMAIN" >> .env
          echo "CUREME_OLD_DOMAIN=\"$CUREME_OLD_DOMAIN\"" >> .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --pull never --remove-orphans
          for i in $(seq 1 30); do
            if docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
              echo "CureMe is up"; docker image prune -f >/dev/null; exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 app
          exit 1
          SH
