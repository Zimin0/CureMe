# Ночная проверка почты: настоящее письмо с кодом уходит через SMTP на тестовый ящик.
# Яндекс отклоняет спам сразу, ответом 554 при отправке, поэтому достаточно, чтобы отправка прошла:
# если письмо отклонили, workflow падает, и GitHub сообщает об этом по почте.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions → Secrets):
#   MAIL_SMTP_USER, MAIL_SMTP_PASSWORD  логин и пароль приложения почтового ящика отправителя
#   MAIL_FROM                           адрес отправителя (для Яндекса совпадает с логином)
#   MAIL_LIVE_TO                        тестовые ящики через запятую, например capsula-test@mailsac.com
#   MAIL_SMTP_HOST                      необязательно, по умолчанию smtp.yandex.ru
# Пока секретов нет, проверка пропускается без ошибки.
name: Mail check

on:
  schedule:
    - cron: "17 3 * * *"   # раз в сутки, 06:17 по Москве
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-check
  cancel-in-progress: false

jobs:
  live-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUREME_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST || 'smtp.yandex.ru' }}
      CUREME_SMTP_PORT: "465"
      CUREME_SMTP_SECURITY: ssl
      CUREME_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
      CUREME_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
      CUREME_MAIL_FROM: ${{ secrets.MAIL_FROM }}
      CUREME_LIVE_MAIL_TO: ${{ secrets.MAIL_LIVE_TO }}
    steps:
      - name: check the secrets are set
        id: secrets
        run: |
          if [ -z "$CUREME_SMTP_USER" ] || [ -z "$CUREME_SMTP_PASSWORD" ] || [ -z "$CUREME_LIVE_MAIL_TO" ]; then
            echo "Секреты MAIL_SMTP_USER, MAIL_SMTP_PASSWORD, MAIL_LIVE_TO не заданы: проверка пропущена."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: install
        if: steps.secrets.outputs.run == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: send a real letter
        if: steps.secrets.outputs.run == 'true'
        working-directory: backend
        run: python -m pytest tests/unit/test_mail_addresses.py -k live -q -rA
