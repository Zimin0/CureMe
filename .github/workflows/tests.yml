# Тесты на каждый pull request и push в main. Отдельно от деплоя: деплой не ждёт этот workflow.
#
# В pull request запускается только то, что проверяет изменённый код: job changes смотрит
# на git diff и решает (scripts/select_tests.py, разделы описаны в TESTING.md).
# На push в main и при ручном запуске (Run workflow) всегда идёт полный прогон.
#
# Уровни (от быстрых к медленным):
#   backend   — unit + интеграционные тесты API + миграции; на SQLite и на Postgres
#   frontend  — проверка типов, unit и компонентные тесты (Vitest + Testing Library + MSW), сборка
#   e2e       — Playwright: настоящий Chromium против настоящего бэкенда, экраны компьютера и телефона
#   docker    — smoke-тест: собираем образ как для сервера и проверяем, что он отвечает
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Токену GITHUB_TOKEN хватает чтения кода: меньше прав — меньше вреда, если шаг сборки скомпрометирован.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: choose tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      backend_tests: ${{ steps.select.outputs.backend_tests }}
      frontend: ${{ steps.select.outputs.frontend }}
      frontend_files: ${{ steps.select.outputs.frontend_files }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
      docker: ${{ steps.select.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: check the section map is up to date
        run: python -m pytest scripts -q
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/select_tests.py --base "$BASE_SHA" --github-output
          else
            python scripts/select_tests.py --full --github-output
          fi

  backend:
    name: backend (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cureme, POSTGRES_PASSWORD: cureme, POSTGRES_DB: cureme_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cureme" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          CUREME_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://cureme:cureme@localhost:5432/cureme_test' || '' }}
          # пусто — все тесты, иначе только выбранные файлы
          TESTS: ${{ needs.changes.outputs.backend_tests }}
        run: pytest $TESTS --cov=app --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: vitest
        env:
          FILES: ${{ needs.changes.outputs.frontend_files }}
        # vitest related сам находит тесты, которые импортируют изменённые файлы (прямо или через другие модули)
        run: |
          if [ -n "$FILES" ]; then npx vitest related --run $FILES; else npm run test:coverage; fi
      - run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: playwright
        working-directory: frontend
        env:
          SPECS: ${{ needs.changes.outputs.e2e_specs }}
        run: npm run test:e2e -- $SPECS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: docker smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cureme-app:test --build-arg CUREME_COMMIT="${GITHUB_SHA::7}" .
      - name: start container and check it answers
        run: |
          docker run -d --name cureme -p 8000:8000 -e CUREME_SECRET_KEY=smoke-test-secret-smoke-test-secret cureme-app:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health | grep -q '"ok":true'
          curl -fsS http://localhost:8000/api/version | grep -q "\"version\":\"$(cat VERSION)\",\"commit\":\"${GITHUB_SHA::7}\""
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/medicines | grep -q '<div id="root">'   # SPA: любой путь отдаёт index.html
          curl -fsS http://localhost:8000/api/conditions | grep -q 'Головная боль'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/auth/me)" = 401
          curl -fsSI http://localhost:8000/ | grep -qi '^content-security-policy:'
          # приложение работает не от root
          test "$(docker exec cureme awk '/^Uid/{print $2}' /proc/1/status)" = 10001
      - if: failure()
        run: docker logs cureme
