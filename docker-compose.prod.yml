# Продакшен на своём сервере: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Приложение наружу не торчит, снаружи только Caddy на 80/443 с HTTPS.
services:
  app:
    ports: !reset []
    expose: ["8000"]
    environment:
      # Настоящий адрес посетителя приходит от Caddy в X-Forwarded-For (нужен для лимитов попыток входа).
      # Доверять заголовку безопасно: порт 8000 наружу не открыт, до приложения доходит только Caddy.
      FORWARDED_ALLOW_IPS: "*"
      CUREME_API_DOCS: "false"
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CUREME_DOMAIN: ${CUREME_DOMAIN:?укажите домен в .env}
      CUREME_OLD_DOMAIN: ${CUREME_OLD_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
