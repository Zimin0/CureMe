# Продакшен на своём сервере: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Приложение наружу не торчит, снаружи только Caddy на 80/443 с HTTPS.
services:
  app:
    ports: !reset []
    expose: ["8000"]
    environment:
      # Настоящий адрес посетителя приходит от Caddy в X-Forwarded-For (нужен для лимитов попыток входа).
      # Доверять заголовку безопасно: порт 8000 наружу не открыт, до приложения доходит только Caddy.
      FORWARDED_ALLOW_IPS: "*"
      CUREME_API_DOCS: "false"
      # Ссылки в письмах ведут на основной домен, а не на тот, что пришёл в заголовке Host.
      CUREME_PUBLIC_URL: https://${CUREME_DOMAIN}
      # Почта для писем «Подтвердите почту». Значения берутся из /opt/cureme/.env (см. DEPLOY.md, раздел 7).
      # Пока CUREME_SMTP_HOST пуст, письма не отправляются и подтверждение почты выключено.
      CUREME_SMTP_HOST: ${CUREME_SMTP_HOST:-}
      CUREME_SMTP_PORT: ${CUREME_SMTP_PORT:-465}
      CUREME_SMTP_SECURITY: ${CUREME_SMTP_SECURITY:-ssl}
      CUREME_SMTP_USER: ${CUREME_SMTP_USER:-}
      CUREME_SMTP_PASSWORD: ${CUREME_SMTP_PASSWORD:-}
      CUREME_MAIL_FROM: ${CUREME_MAIL_FROM:-}
      # Telegram-бот для напоминаний (DEPLOY.md, раздел 8). Пусто — напоминания только на почту.
      CUREME_TELEGRAM_BOT_TOKEN: ${CUREME_TELEGRAM_BOT_TOKEN:-}
      CUREME_TELEGRAM_BOT_USERNAME: ${CUREME_TELEGRAM_BOT_USERNAME:-}
      CUREME_REMINDERS_HOUR: ${CUREME_REMINDERS_HOUR:-10}
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CUREME_DOMAIN: ${CUREME_DOMAIN:?укажите домен в .env}
      CUREME_OLD_DOMAIN: ${CUREME_OLD_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
